<main class="login-page">
  <section class="login-card">
    <img src="/assets/brand/logo-regas.png" alt="Nusantara Regas" />
    <p class="eyebrow">PTW Online · Development</p>
    <h1>Masuk</h1>
    <p class="intro">
      Gunakan akun yang dibuat Administrator. Login lokal ini hanya aktif pada lingkungan
      Development.
    </p>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label
        ><span>Username</span><input formControlName="userName" autocomplete="username" autofocus
      /></label>
      <label
        ><span>Password</span
        ><input type="password" formControlName="password" autocomplete="current-password"
      /></label>
      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Memeriksa…' : 'Masuk' }}
      </button>
    </form>
    <div class="login-divider"><span>atau</span></div>
    <button class="demo-button" type="button" (click)="useDemo()">Gunakan mode demo</button>
    <small>Mode demo hanya tersedia untuk bootstrap Administrator dan pengujian Development.</small>
  </section>
</main>
