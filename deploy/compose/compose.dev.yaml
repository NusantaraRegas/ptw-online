name: nr-ptw-dev

services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${PTW_SQL_BOOTSTRAP_PASSWORD:?copy .env.example to .env and set a development password}
    ports:
      - "${PTW_SQL_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 45s

  migrate:
    build:
      context: ../..
      dockerfile: src/Ptw.Api/Dockerfile
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PtwDb: Server=db;Database=PtwOnline;User Id=sa;Password=${PTW_SQL_BOOTSTRAP_PASSWORD};TrustServerCertificate=True;Encrypt=True
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: src/Ptw.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PtwDb: Server=db;Database=PtwOnline;User Id=sa;Password=${PTW_SQL_BOOTSTRAP_PASSWORD};TrustServerCertificate=True;Encrypt=True
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: src/Ptw.Worker/Dockerfile
    environment:
      ConnectionStrings__PtwDb: Server=db;Database=PtwOnline;User Id=sa;Password=${PTW_SQL_BOOTSTRAP_PASSWORD};TrustServerCertificate=True;Encrypt=True
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  web:
    build:
      context: ../..
      dockerfile: src/web/Dockerfile
    ports:
      - "${PTW_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend, backend]

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  sql-data: {}
