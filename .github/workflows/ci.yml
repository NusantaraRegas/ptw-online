name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PtwOnline.sln
      - run: dotnet build PtwOnline.sln --configuration Release --no-restore
      - run: dotnet test PtwOnline.sln --configuration Release --no-build
      - name: Vulnerable NuGet packages (high/critical fail the build)
        run: |
          set -o pipefail
          dotnet list PtwOnline.sln package --vulnerable --include-transitive | tee vulnerable-packages.txt
          if grep -Eq '\b(High|Critical)\b' vulnerable-packages.txt; then
            echo "::error::Vulnerable package(s) with High or Critical severity found."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
      - run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f deploy/compose/compose.dev.yaml config --quiet
      - run: docker compose --env-file deploy/compose/prod.env.example -f deploy/compose/compose.prod.yaml config --quiet
        env:
          PTW_SQL_SA_PASSWORD: ci-only-placeholder
          PTW_SQL_APP_PASSWORD: ci-only-placeholder
          PTW_DATA_PROTECTION_CERT_PASSWORD: ci-only-placeholder
